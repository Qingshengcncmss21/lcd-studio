name: Deploy LCD Studio

on:
  push:
    branches: [main]
    paths:
      - lcd-studio-pages.zip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack LCD Studio
        run: |
          unzip -q lcd-studio-pages.zip -d dist
          test -s dist/index.html
          test -s dist/lcd-core.html
          test -s dist/build-info.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
